name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run mypy wearable_assistant_context_bench

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run pytest --cov=wearable_assistant_context_bench --cov-report=term-missing

  wheel-smoke:
    # Build the wheel, install it into a fresh venv that has no source
    # tree, and run the console script. Catches packaging regressions
    # (missing runtime data, broken entry point) that pytest alone misses.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv build
      - run: uv venv /tmp/wac-wheel-smoke
      - run: uv pip install --python /tmp/wac-wheel-smoke/bin/python dist/wearable_assistant_context_bench-*.whl
      - run: /tmp/wac-wheel-smoke/bin/wac-bench --help

  scenario-audit:
    # Advisory: re-classifies every scenario from script content alone
    # and reports shift_type / difficulty_tier disagreements with the
    # authored metadata. Drift surfaces in the logs and as a CSV
    # artifact; nothing blocks the build.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Run scenario audit
        run: uv run python scripts/audit_scenarios.py
        continue-on-error: true
      - name: Upload audit CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenarios-audit
          path: data/scenarios.audit.csv
          if-no-files-found: warn
